name: luminafm-saas-cluster

services:
  # ===========================================================================
  # 1. PostgreSQL 16 Multi-Tenant High-Availability Relational Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: luminafm-saas-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-luminafm_saas_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SECURE_POSTGRES_PASSWORD_2026}
      POSTGRES_DB: ${POSTGRES_DB:-luminafm_saas_db}
    ports:
      - "5432:5432"
    volumes:
      - saas_postgres_data:/var/lib/postgresql/data
    networks:
      - luminafm_saas_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-luminafm_saas_admin} -d $${POSTGRES_DB:-luminafm_saas_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ===========================================================================
  # 2. Redis 7 Cluster for Distributed Token Management & Rate Limiting
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: luminafm-saas-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-SECURE_REDIS_PASSWORD_2026}"]
    ports:
      - "6379:6379"
    volumes:
      - saas_redis_data:/data
    networks:
      - luminafm_saas_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-SECURE_REDIS_PASSWORD_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================================================================
  # 3. MinIO Multi-Tenant Object Storage (S3 Compatible Evidence Vault)
  # ===========================================================================
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: luminafm-saas-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-MINIO_ROOT_SECRET_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - saas_minio_data:/data
    networks:
      - luminafm_saas_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ===========================================================================
  # 4. Backend Instance Replica 1 (Shared Multi-Tenant SaaS)
  # ===========================================================================
  backend-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luminafm-saas-backend-1
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DEPLOYMENT_MODEL: saas
      DATABASE_URL: postgresql://${POSTGRES_USER:-luminafm_saas_admin}:${POSTGRES_PASSWORD:-SECURE_POSTGRES_PASSWORD_2026}@postgres:5432/${POSTGRES_DB:-luminafm_saas_db}?schema=public&connection_limit=25
      JWT_SECRET: ${JWT_SECRET:-9d7e6f8a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e}
      JWT_SECRET_SECONDARY: ${JWT_SECRET_SECONDARY:-1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b}
      REDIS_URL: redis://:${REDIS_PASSWORD:-SECURE_REDIS_PASSWORD_2026}@redis:6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-luminafm-evidence-vault}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-MINIO_ROOT_SECRET_2026}
      S3_USE_SSL: "false"
      RUN_SEED: "true"
    volumes:
      - saas_uploads_data:/app/uploads
      - saas_backups_data:/var/backups/luminafm
    networks:
      - luminafm_saas_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ===========================================================================
  # 5. Backend Instance Replica 2 (Horizontal Scaling & Zero-Downtime Rollover)
  # ===========================================================================
  backend-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luminafm-saas-backend-2
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DEPLOYMENT_MODEL: saas
      DATABASE_URL: postgresql://${POSTGRES_USER:-luminafm_saas_admin}:${POSTGRES_PASSWORD:-SECURE_POSTGRES_PASSWORD_2026}@postgres:5432/${POSTGRES_DB:-luminafm_saas_db}?schema=public&connection_limit=25
      JWT_SECRET: ${JWT_SECRET:-9d7e6f8a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e}
      JWT_SECRET_SECONDARY: ${JWT_SECRET_SECONDARY:-1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b}
      REDIS_URL: redis://:${REDIS_PASSWORD:-SECURE_REDIS_PASSWORD_2026}@redis:6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-luminafm-evidence-vault}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-MINIO_ROOT_SECRET_2026}
      S3_USE_SSL: "false"
      RUN_SEED: "false"
    volumes:
      - saas_uploads_data:/app/uploads
      - saas_backups_data:/var/backups/luminafm
    networks:
      - luminafm_saas_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ===========================================================================
  # 6. Automated Backup & Disaster Recovery Worker
  # ===========================================================================
  backup-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luminafm-saas-backup-worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c", "while true; do /app/scripts/backup.sh || true; sleep 86400; done"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-luminafm_saas_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SECURE_POSTGRES_PASSWORD_2026}
      POSTGRES_DB: ${POSTGRES_DB:-luminafm_saas_db}
      BACKUP_STORAGE_PATH: /var/backups/luminafm
      BACKUP_RETENTION_DAYS: 90
    volumes:
      - saas_backups_data:/var/backups/luminafm
    networks:
      - luminafm_saas_net

  # ===========================================================================
  # 7. Frontend UI Container (React + Vite + Nginx)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: luminafm-saas-frontend
    restart: always
    networks:
      - luminafm_saas_net

  # ===========================================================================
  # 8. Edge Nginx Gateway (SSL Termination, Subdomain Routing & Load Balancing)
  # ===========================================================================
  gateway:
    image: nginx:1.27-alpine
    container_name: luminafm-saas-gateway
    restart: always
    depends_on:
      - backend-1
      - backend-2
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d/saas.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - luminafm_saas_net

networks:
  luminafm_saas_net:
    driver: bridge

volumes:
  saas_postgres_data:
  saas_redis_data:
  saas_minio_data:
  saas_uploads_data:
  saas_backups_data:
