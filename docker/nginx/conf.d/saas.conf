# =============================================================================
# LuminaFM - Shared Multi-Tenant SaaS Nginx Gateway Configuration
# Features: Upstream load balancing, SSL termination, multi-tenant subdomain routing
# =============================================================================

upstream luminafm_backend_cluster {
    least_conn;
    server backend-1:3000 max_fails=3 fail_timeout=10s;
    server backend-2:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream luminafm_frontend_cluster {
    server frontend:80;
}

server {
    listen 80;
    server_name ~^(?<tenant>.+)\.luminafm\.com$ luminafm.com app.luminafm.com;

    # Redirect all HTTP traffic to HTTPS in production
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ~^(?<tenant>.+)\.luminafm\.com$ luminafm.com app.luminafm.com;

    ssl_certificate /etc/nginx/ssl/live/luminafm.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/luminafm.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "0" always;

    client_max_body_size 50M;

    # Route API calls to backend cluster with tenant subdomain identification
    location /api/ {
        proxy_pass http://luminafm_backend_cluster/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Tenant-Domain $tenant;
        proxy_read_timeout 90s;
    }

    # Health probe bypass
    location /health {
        proxy_pass http://luminafm_backend_cluster/health;
        proxy_set_header Host $host;
    }

    # Prometheus metrics
    location /metrics {
        proxy_pass http://luminafm_backend_cluster/metrics;
        proxy_set_header Host $host;
    }

    # UI Static App
    location / {
        proxy_pass http://luminafm_frontend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
