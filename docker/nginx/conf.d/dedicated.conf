# =============================================================================
# LuminaFM - Dedicated Customer On-Premise / Single-Tenant Nginx Gateway
# =============================================================================

upstream dedicated_backend {
    server backend:3000;
}

upstream dedicated_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name ${CUSTOMER_DOMAIN:-boiler-facility.client.internal};

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://dedicated_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://dedicated_backend/health;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://dedicated_backend/metrics;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://dedicated_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
