name: LuminaFM Commercial CI Pipeline

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

jobs:
  # ===========================================================================
  # 1. Typecheck & Code Quality Validation
  # ===========================================================================
  quality-gate:
    name: TypeScript & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Backend Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Backend TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Build & Typecheck
        working-directory: ./frontend
        run: npm run build

  # ===========================================================================
  # 2. Automated Test Suite (Unit, Integration, Security & ANP)
  # ===========================================================================
  test-suite:
    name: Acceptance & Regression Tests
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Production-Readiness & Acceptance Tests
        run: npx vitest run tests/production-readiness.test.ts tests/audit-and-evidence-management.test.ts tests/frontend-design-system.test.ts
        env:
          NODE_ENV: test
          JWT_SECRET: lumina-fm-test-suite-secret-key-32chars-fixture

  # ===========================================================================
  # 3. Security & Dependency Vulnerability Audit
  # ===========================================================================
  security-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run npm audit (Production Dependencies)
        run: npm audit --audit-level=high --omit=dev

  # ===========================================================================
  # 4. Multi-Stage Docker Container Build & Verification
  # ===========================================================================
  container-build:
    name: Container Build & Healthcheck Smoke Test
    runs-on: ubuntu-latest
    needs: [quality-gate, test-suite]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: luminafm-backend:ci-latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: luminafm-frontend:ci-latest
