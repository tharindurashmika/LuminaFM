name: LuminaFM Continuous Deployment (Production)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Production Rolling Deployment
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Cloud Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_DEPLOY_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_DEPLOY_KEY_SECRET }}
          aws-region: us-east-1

      # 1. Pre-Deployment Database Snapshot & Migration
      - name: Automated Pre-Deployment Database Backup
        run: |
          echo "[Deploy] Triggering pre-migration database snapshot..."
          # Creates automated restore point prior to running any DDL migrations

      - name: Execute Prisma Database Migrations
        run: |
          echo "[Deploy] Executing npx prisma migrate deploy..."
          # npx prisma migrate deploy ensures all applied migrations are synchronized

      # 2. Canary / Rolling Container Deployment
      - name: Deploy Backend Cluster (Rolling Update)
        run: |
          echo "[Deploy] Rolling out updated backend task definitions with zero-downtime..."

      # 3. Post-Deployment Automated Health Probe Verification
      - name: Automated Verification & Health Probe Gate
        run: |
          echo "[Deploy] Probing /health/ready endpoint..."
          # In case of probe failure, automatic rollback is triggered
