name: luminafm-dedicated-customer

services:
  # ===========================================================================
  # 1. Customer-Dedicated PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: luminafm-dedicated-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-customer_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CUSTOMER_SECURE_PASS_2026}
      POSTGRES_DB: ${POSTGRES_DB:-luminafm_customer_db}
    ports:
      - "127.0.0.1:5432:5432" # Bind only to localhost for isolation
    volumes:
      - dedicated_postgres_data:/var/lib/postgresql/data
    networks:
      - dedicated_isolated_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-customer_admin} -d $${POSTGRES_DB:-luminafm_customer_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ===========================================================================
  # 2. Customer-Dedicated LuminaFM Backend Application
  # ===========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luminafm-dedicated-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DEPLOYMENT_MODEL: dedicated
      DATABASE_URL: postgresql://${POSTGRES_USER:-customer_admin}:${POSTGRES_PASSWORD:-CUSTOMER_SECURE_PASS_2026}@postgres:5432/${POSTGRES_DB:-luminafm_customer_db}?schema=public&connection_limit=20
      JWT_SECRET: ${JWT_SECRET:-customer-dedicated-64char-secret-key-3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/uploads
      BACKUP_STORAGE_PATH: /var/backups/luminafm
      BACKUP_RETENTION_DAYS: 365
      RUN_SEED: "true"
    volumes:
      - dedicated_uploads_data:/app/uploads
      - dedicated_backups_data:/var/backups/luminafm
    networks:
      - dedicated_isolated_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ===========================================================================
  # 3. Customer-Dedicated Frontend Application
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: luminafm-dedicated-frontend
    restart: unless-stopped
    networks:
      - dedicated_isolated_net

  # ===========================================================================
  # 4. Customer-Dedicated Gateway
  # ===========================================================================
  gateway:
    image: nginx:1.27-alpine
    container_name: luminafm-dedicated-gateway
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d/dedicated.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dedicated_isolated_net

networks:
  dedicated_isolated_net:
    driver: bridge
    internal: false

volumes:
  dedicated_postgres_data:
  dedicated_uploads_data:
  dedicated_backups_data:
